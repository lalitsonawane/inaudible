services:
  - type: web
    runtime: static
    name: ultrasonic-fsk-link
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Permissions-Policy
        value: "microphone=(self), autoplay=(self)"
